---

main:
  class:             'SimulParams'
  root_dir:          './calib/SCAO'
  pixel_pupil:       160
  pixel_pitch:       0.05
  total_time:        0.005
  time_step:         0.001

on_axis_source:
  class:             'Source'
  polar_coordinates:  [0.0, 0.0]
  magnitude:         8
  wavelengthInNm:    750

pupilstop:
  class: 'Pupilstop'
  simul_params_ref: 'main'

prop:
  class:                'AtmoPropagation'
  simul_params_ref:     'main'
  source_dict_ref:      ['on_axis_source']
  inputs:
    common_layer_list: ['pupilstop']
  outputs: ['out_on_axis_source_ef']

ph_disp:
  class:            'PhaseDisplay'
  inputs:
    phase:       "prop.out_on_axis_source_ef"
  title:            'PUPIL PHASE'
