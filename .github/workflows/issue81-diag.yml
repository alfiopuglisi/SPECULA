# Temporary: diagnose the web frontend on macOS (issue #81)

name: Issue 81 frontend diag

on:
  push:
    branches: [ ci-issue-81 ]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Diagnose frontend
      run: python ci_issue81/diag_frontend.py
