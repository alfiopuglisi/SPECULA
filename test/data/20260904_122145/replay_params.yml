main:
  class: SimulParams
  root_dir: ./calib/
  pixel_pupil: 64
  pixel_pitch: 0.015625
  total_time: 0.1
  time_step: 0.001
seeing:
  class: WaveGenerator
  constant: 0.6
  wave_type: SIN
  outputs:
  - output
wind_speed:
  class: WaveGenerator
  constant:
  - 5.0
  outputs:
  - output
wind_direction:
  class: WaveGenerator
  constant:
  - 10.0
  outputs:
  - output
on_axis_source:
  class: Source
  polar_coordinates:
  - 0.0
  - 0.0
  magnitude: 5
  wavelengthInNm: 600
pupilstop:
  class: Pupilstop
  simul_params_ref: main
  target_rank: 1
atmo:
  class: AtmoEvolution
  simul_params_ref: main
  L0: 25
  heights:
  - 0.0
  Cn2:
  - 1.0
  fov: 0.0
  pixel_phasescreens: 1024
  inputs:
    seeing: seeing.output
    wind_speed: wind_speed.output
    wind_direction: wind_direction.output
  outputs:
  - layer_list
  target_rank: 0
prop:
  class: AtmoPropagation
  simul_params_ref: main
  source_dict_ref:
  - on_axis_source
  inputs:
    atmo_layer_list:
    - atmo.layer_list
    common_layer_list:
    - pupilstop
    - dm.out_layer:-1
  outputs:
  - out_on_axis_source_ef
  target_rank: 1
sh:
  class: SH
  subap_wanted_fov: 4.0
  sensor_pxscale: 0.5
  subap_npx: 8
  subap_on_diameter: 8
  wavelengthInNm: 600
  inputs:
    in_ef: prop.out_on_axis_source_ef
  outputs:
  - out_i
  target_rank: 1
detector:
  class: CCD
  simul_params_ref: main
  size:
  - 64
  - 64
  dt: 0.001
  bandw: 300
  photon_noise: true
  readout_noise: true
  readout_level: 1.0
  quantum_eff: 0.3
  inputs:
    in_i: sh.out_i
  outputs:
  - out_pixels
slopec:
  class: ShSlopec
  subapdata_object: scao_subaps_n8_th0.5
  weightedPixRad: 4.0
  inputs:
    in_pixels: detector.out_pixels
  outputs:
  - out_slopes
  - out_subapdata
rec:
  class: Modalrec
  recmat_object: scao_rec_n8_th0.5
  inputs:
    in_slopes: slopec.out_slopes
  outputs:
  - out_modes
control:
  class: Integrator
  delay: 2
  int_gain:
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  inputs:
    delta_comm: rec.out_modes
  outputs:
  - out_comm
dm:
  class: DM
  simul_params_ref: main
  type_str: zernike
  nmodes: 40
  obsratio: 0.1
  height: 0
  inputs:
    in_command: control.out_comm
  outputs:
  - out_layer
data_source:
  class: DataSource
  outputs:
  - res_sr
  store_dir: ./data/20260904_122145
  global_precision: 1
