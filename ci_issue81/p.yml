---
# Long enough (in wall-clock time) for the display server child process
# to finish (or fail) its startup before the simulation ends.

main:
  class:             'SimulParams'
  root_dir:          './calib/SCAO'
  pixel_pupil:       160
  pixel_pitch:       0.05
  total_time:        1000.0
  time_step:         0.001
  display_server:    true

on_axis_source:
  class:             'Source'
  polar_coordinates:  [0.0, 0.0]
  magnitude:         8
  wavelengthInNm:    750

pupilstop:
  class: 'Pupilstop'
  simul_params_ref: 'main'

prop:
  class:                'AtmoPropagation'
  simul_params_ref:     'main'
  source_dict_ref:      ['on_axis_source']
  inputs:
    common_layer_list: ['pupilstop']
  outputs: ['out_on_axis_source_ef']
